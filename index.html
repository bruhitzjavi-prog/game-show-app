<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAMESHOWS LIVE</title>
    <style>
        :root { --light-blue: #87CEEB; --midnight: #050505; --card-bg: #111111; }
        body { margin: 0; padding: 0; background-color: var(--midnight); color: white; font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; display: flex; justify-content: center; }
        
        /* PC & Mobile Responsive Resolution */
        .app-container { width: 100%; max-width: 480px; min-height: 100vh; border-x: 1px solid #1a1a1a; display: flex; flex-direction: column; background-color: var(--midnight); }
        @media (min-width: 1024px) { .app-container { max-width: 1100px; } .grid { grid-template-columns: repeat(4, 1fr) !important; } }
        
        header { padding: 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a1a1a; background: rgba(5,5,5,0.9); position: sticky; top: 0; z-index: 50; }
        .logo { font-weight: 900; font-size: 28px; color: var(--light-blue); letter-spacing: -1px; text-transform: uppercase; }

        .search-input { width: calc(100% - 40px); background: #1a1a1a; border: 1px solid #333; padding: 15px; border-radius: 12px; color: white; margin: 10px 20px; font-size: 14px; box-sizing: border-box; }
        .catalog { display: flex; gap: 10px; padding: 10px 20px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .cat-btn { padding: 10px 22px; background: #1a1a1a; border: none; border-radius: 99px; font-size: 11px; font-weight: 800; color: #666; cursor: pointer; }
        .cat-btn.active { background: var(--light-blue); color: #000; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .card { background: var(--card-bg); border: 1px solid #222; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; transition: 0.2s; }
        .card:hover { transform: translateY(-4px); border-color: var(--light-blue); }
        
        /* High-Stability Professional Tile System */
        .card-img { 
            height: 140px; border-bottom: 1px solid #1a1a1a; 
            display: flex; align-items: center; justify-content: center; 
            text-align: center; font-weight: 900; font-size: 14px; 
            padding: 10px; box-sizing: border-box; background-size: cover;
            background-position: center;
        }
        .card-info { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-tag { font-size: 9px; color: #555; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
        .card-btn { background: var(--light-blue); color: #000; padding: 12px; border-radius: 10px; text-align: center; font-size: 11px; font-weight: 900; border: none; cursor: pointer; text-decoration: none; }

        #loader { display: none; position: fixed; inset: 0; background: #000; z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(135, 206, 235, 0.1); border-top-color: var(--light-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div><div style="color:var(--light-blue); font-weight:900; margin-top:20px; font-size:12px;">LOADING SHOW...</div></div>
    
    <div class="app-container">
        <header><div class="logo">GAMESHOWS</div><div style="color: #10b981; font-size: 10px; font-weight: 800; border: 1px solid #10b981; padding: 2px 8px; border-radius: 99px;">ONLINE</div></header>
        <input type="text" id="searchInput" class="search-input" placeholder="Search shows or tables..." onkeyup="filterGames()">
        <div class="catalog"><button class="cat-btn active" onclick="setCategory('all', this)">All Shows</button><button class="cat-btn" onclick="setCategory('table', this)">Live Tables</button><button class="cat-btn" onclick="setCategory('wheel', this)">Big Wheels</button><button class="cat-btn" onclick="setCategory('slot', this)">Live Slots</button></div>
        
        <div class="grid" id="gameGrid">
            <!-- Game 1: Blackjack -->
            <div class="card" data-name="blackjack" data-type="table">
                <div class="card-img" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1596838132731-3301c3fd4317?w=400');">LIVE<br>BLACKJACK</div>
                <div class="card-info"><div class="card-tag">ICONIC21</div><a href="#" onclick="launch('live-casino/blackjack/mcLuck-blackjack')" class="card-btn">PLAY NOW</a></div>
            </div>
            <!-- Game 2: Wonderland -->
            <div class="card" data-name="wonderland" data-type="wheel">
                <div class="card-img" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1605152276897-4f618f831968?w=400');">BEYOND<br>WONDERLAND</div>
                <div class="card-info"><div class="card-tag">PLAYTECH</div><a href="#" onclick="launch('live-casino/game-shows/adventures-beyond-wonderland')" class="card-btn">PLAY NOW</a></div>
            </div>
            <!-- Game 3: Roulette -->
            <div class="card" data-name="roulette" data-type="table">
                <div class="card-img" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1518133835878-5a93cc3f89e5?w=400');">AMERICAN<br>ROULETTE</div>
                <div class="card-info"><div class="card-tag">ICONIC21</div><a href="#" onclick="launch('live-casino/roulette/mcluck-american-roulette')" class="card-btn">PLAY NOW</a></div>
            </div>
            <!-- Game 4: Mega Wheel -->
            <div class="card" data-name="mega wheel" data-type="wheel">
                <div class="card-img" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1585338663020-29d33d44422a?w=400');">MEGA WHEEL<br>LIVE</div>
                <div class="card-info"><div class="card-tag">PRAGMATIC</div><a href="#" onclick="launch('live-casino/game-shows/mega-wheel')" class="card-btn">PLAY NOW</a></div>
            </div>
            <!-- Game 5: Baccarat -->
            <div class="card" data-name="baccarat" data-type="table">
                <div class="card-img" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1606167668584-78701c57f13d?w=400');">LIVE<br>BACCARAT</div>
                <div class="card-info"><div class="card-tag">ICONIC21</div><a href="#" onclick="launch('live-casino/baccarat/live-baccarat-iconic-21')" class="card-btn">PLAY NOW</a></div>
            </div>
            <!-- Game 6: Buffalo -->
            <div class="card" data-name="buffalo" data-type="slot">
                <div class="card-img" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1518133910546-b6c2fb7d79e3?w=400');">BUFFALO BLITZ<br>LIVE</div>
                <div class="card-info"><div class="card-tag">PLAYTECH</div><a href="#" onclick="launch('live-casino/game-shows/buffalo-blitz-live-slots')" class="card-btn">PLAY NOW</a></div>
            </div>
        </div>

        <footer style="padding: 40px 20px; text-align: center; color: #222; font-size: 10px; font-weight: 900; border-top: 1px solid #111; letter-spacing: 2px;">GAMESHOWS DISCOVERY PORTAL</footer>
    </div>
    <script>
        function setCategory(type, btn) { document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); const cards = document.querySelectorAll('.card'); cards.forEach(card => { card.style.display = (type === 'all' || card.getAttribute('data-type') === type) ? 'flex' : 'none'; }); }
        function filterGames() { const input = document.getElementById('searchInput').value.toLowerCase(); const cards = document.querySelectorAll('.card'); cards.forEach(card => { card.style.display = card.getAttribute('data-name').includes(input) ? 'flex' : 'none'; }); }
        function launch(path) { document.getElementById('loader').style.display = 'flex'; setTimeout(() => { window.location.href = `https://www.mcluck.com/games/${path}?r=6f535be9%2F2810840932`; }, 800); }
    </script>
</body>
</html>
