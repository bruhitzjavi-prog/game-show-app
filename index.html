<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAMESHOWS - Live Discovery</title>
    <style>
        body { 
            margin: 0; padding: 0; background-color: #050505; color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center;
        }
        .app-container {
            width: 100%; max-width: 450px; min-height: 100vh;
            border-left: 1px solid #222; border-right: 1px solid #222;
            display: flex; flex-direction: column; background-color: #050505;
        }
        header {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #222; position: sticky; top: 0; background: rgba(5,5,5,0.9); z-index: 10;
        }
        /* Your Light Blue Gameshows Title */
        .logo { font-weight: 900; font-size: 24px; color: #87CEEB; letter-spacing: 1px; text-transform: uppercase; }
        
        .live-tag { color: #10b981; font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px solid #10b981; padding: 2px 8px; border-radius: 4px; }
        
        .hero {
            position: relative; height: 320px;
            background-image: linear-gradient(to bottom, transparent, #050505), url('[https://www.casino.org/casinoscores/wp-content/uploads/2021/01/adventures-beyond-wonderland.jpg'](https://www.casino.org/casinoscores/wp-content/uploads/2021/01/adventures-beyond-wonderland.jpg'));
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: flex-end; padding: 25px;
        }
        .hero h2 { font-size: 32px; font-weight: 900; margin: 0; line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .hero-btn { margin-top: 15px; background: #ff00ff; color: white; padding: 16px; border-radius: 12px; font-weight: 800; text-align: center; text-decoration: none; font-size: 14px; text-transform: uppercase; }

        .section-title { padding: 25px 25px 10px; font-size: 12px; font-weight: 800; color: #888; text-transform: uppercase; letter-spacing: 2px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 40px; }
        .card { background: #111; border: 1px solid #222; border-radius: 15px; overflow: hidden; }
        /* Actual Game Pictures */
        .card-img { height: 130px; background-size: cover; background-position: center; background-repeat: no-repeat; }
        .card-info { padding: 12px; background: #161616; }
        .card-name { font-size: 12px; font-weight: 800; margin-bottom: 8px; color: #fff; }
        .card-btn { background: #ff00ff; color: #fff; padding: 10px; border-radius: 8px; text-align: center; font-size: 11px; font-weight: 800; text-decoration: none; display: block; }
        
        #loader { display: none; position: fixed; inset: 0; background: #000; z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,0,255,0.2); border-top-color: #ff00ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
