<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showtime - Live Game Show Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #ffffff; }
        .hero-gradient { background: linear-gradient(180deg, rgba(255,0,255,0.1) 0%, rgba(5,5,5,1) 100%); }
        .magenta-glow { box-shadow: 0 0 20px rgba(255,0,255,0.3); }
        .game-tile { background-size: cover; background-position: center; transition: 0.3s; }
        .game-tile:hover { transform: scale(1.02); border-color: #ff00ff; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">
    <div class="w-full max-w-md min-h-screen border-x border-zinc-800 flex flex-col bg-[#050505]">
        
        <!-- Header -->
        <header class="p-5 flex justify-between items-center sticky top-0 bg-[#050505]/90 backdrop-blur-md z-50 border-b border-zinc-800">
            <h1 class="text-2xl font-extrabold tracking-tighter" style="color: #ff00ff;">SHOWTIME</h1>
            <div class="px-3 py-1 bg-emerald-500/10 border border-emerald-500/20 rounded-full text-emerald-400 text-xs font-bold uppercase tracking-widest">US-Legal</div>
        </header>

        <!-- Hero Section -->
        <div class="relative h-60 w-full overflow-hidden hero-gradient flex items-end p-6 border-b border-zinc-800">
            <div class="absolute inset-0 bg-cover bg-center opacity-60" style="background-image: url('https://static.mcluck.com/game-assets/playtech/adventures-beyond-wonderland-live/thumbnail.jpg');"></div>
            <div class="relative z-10 w-full">
                <span class="bg-red-600 text-white text-[10px] font-black px-2 py-0.5 rounded-sm mb-2 inline-block animate-pulse">ON AIR</span>
                <h2 class="text-2xl font-bold leading-none">Adventures Beyond Wonderland</h2>
                <div class="flex justify-between items-center mt-2">
                    <p class="text-zinc-300 text-xs">12.4k watching</p>
                    <a href="https://www.mcluck.com/lp/raf?r=6f535be9%2F2810840932" class="px-4 py-2 bg-[#ff00ff] text-white text-xs font-black rounded-lg uppercase">Watch Now</a>
                </div>
            </div>
        </div>

        <div class="section-title px-5 pt-6 pb-2 text-[10px] font-black text-zinc-500 uppercase tracking-widest">Live Show Catalog</div>

        <!-- Game Grid -->
        <div class="grid grid-cols-2 gap-4 p-5">
            <!-- Game 1: Adventures -->
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden game-tile" style="background-image: url('https://static.mcluck.com/game-assets/playtech/adventures-beyond-wonderland-live/tile.jpg');">
                <div class="h-32 bg-black/40 flex flex-col justify-end p-3">
                    <div class="text-[10px] font-black text-white drop-shadow-md">ADVENTURES</div>
                    <a href="https://www.mcluck.com/lp/raf?r=6f535be9%2F2810840932" class="mt-2 w-full py-2 bg-white/10 backdrop-blur-md text-white text-[9px] font-bold rounded border border-white/20 text-center block">PLAY</a>
                </div>
            </div>
            
            <!-- Game 2: Mega Wheel -->
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden game-tile" style="background-image: url('https://static.mcluck.com/game-assets/pragmatic-play/mega-wheel/tile.jpg');">
                <div class="h-32 bg-black/40 flex flex-col justify-end p-3">
                    <div class="text-[10px] font-black text-white drop-shadow-md">MEGA WHEEL</div>
                    <a href="https://www.mcluck.com/lp/raf?r=6f535be9%2F2810840932" class="mt-2 w-full py-2 bg-white/10 backdrop-blur-md text-white text-[9px] font-bold rounded border border-white/20 text-center block">PLAY</a>
                </div>
            </div>

            <!-- Game 3: Spin A Win -->
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden game-tile" style="background-image: url('https://static.mcluck.com/game-assets/playtech/live-spin-a-win/tile.jpg');">
                <div class="h-32 bg-black/40 flex flex-col justify-end p-3">
                    <div class="text-[10px] font-black text-white drop-shadow-md">SPIN A WIN</div>
                    <a href="https://www.mcluck.com/lp/raf?r=6f535be9%2F2810840932" class="mt-2 w-full py-2 bg-white/10 backdrop-blur-md text-white text-[9px] font-bold rounded border border-white/20 text-center block">PLAY</a>
                </div>
            </div>

            <!-- Game 4: Buffalo King Live -->
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden game-tile" style="background-image: url('https://static.mcluck.com/game-assets/playtech/buffalo-blitz-live-slots/tile.jpg');">
                <div class="h-32 bg-black/40 flex flex-col justify-end p-3">
                    <div class="text-[10px] font-black text-white drop-shadow-md">BUFFALO LIVE</div>
                    <a href="https://www.mcluck.com/lp/raf?r=6f535be9%2F2810840932" class="mt-2 w-full py-2 bg-white/10 backdrop-blur-md text-white text-[9px] font-bold rounded border border-white/20 text-center block">PLAY</a>
                </div>
            </div>
        </div>

        <footer class="mt-auto p-10 text-center border-t border-zinc-900 bg-zinc-950">
            <p class="text-[9px] text-zinc-600 font-bold uppercase tracking-[0.2em]">Showtime Discovery Portal • 18+ Only</p>
            <p class="text-[8px] text-zinc-700 mt-2">All games hosted by McLuck.com. We earn commissions on qualifying signups.</p>
        </footer>
    </div>
</body>
</html>
