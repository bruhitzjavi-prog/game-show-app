<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAMESHOWS LIVE</title>
    <style>
        :root { --light-blue: #87CEEB; --midnight: #050505; --card-bg: #111111; --zinc-800: #27272a; }
        body { margin: 0; padding: 0; background-color: var(--midnight); color: white; font-family: -apple-system, sans-serif; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 450px; min-height: 100vh; border-x: 1px solid #1a1a1a; display: flex; flex-direction: column; background-color: var(--midnight); }
        
        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(5,5,5,0.95); position: sticky; top: 0; z-index: 50; }
        .logo { font-weight: 900; font-size: 26px; color: var(--light-blue); letter-spacing: -0.5px; }

        /* Search Bar */
        .search-container { padding: 0 20px 10px; }
        .search-input { width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 12px 15px; border-radius: 12px; color: white; font-size: 14px; outline: none; transition: 0.3s; }
        .search-input:focus { border-color: var(--light-blue); box-shadow: 0 0 10px rgba(135, 206, 235, 0.2); }

        /* Catalog Categories */
        .catalog { display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .catalog::-webkit-scrollbar { display: none; }
        .cat-item { padding: 8px 16px; background: #1a1a1a; border: 1px solid #333; border-radius: 99px; font-size: 12px; font-weight: 700; color: #888; cursor: pointer; }
        .cat-item.active { background: var(--light-blue); color: #000; border-color: var(--light-blue); }

        .hero { position: relative; height: 320px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 30px; }
        .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background-image: url('https://sc02.alicdn.com/kf/Ad72dd1b2b6554a2899334067f9368b28i.png'); filter: brightness(0.6); }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 40%, var(--midnight) 100%); }
        .hero-btn { margin-top: 15px; background: var(--light-blue); color: #000; padding: 16px; border-radius: 14px; font-weight: 900; text-align: center; text-decoration: none; display: block; font-size: 14px; box-shadow: 0 10px 30px rgba(135, 206, 235, 0.3); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px 20px 60px; }
        .card { background: var(--card-bg); border: 1px solid #1f1f1f; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; }
        .card-img { height: 120px; background-size: cover; background-position: center; }
        .card-info { padding: 15px; }
        .card-name { font-size: 11px; font-weight: 800; margin-bottom: 12px; color: #efeff1; }
        .card-btn { background: rgba(135, 206, 235, 0.1); color: var(--light-blue); padding: 10px; border-radius: 10px; text-align: center; font-size: 10px; font-weight: 800; text-decoration: none; display: block; border: 1px solid var(--light-blue); }

        #loader { display: none; position: fixed; inset: 0; background: #000; z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(135, 206, 235, 0.1); border-top-color: var(--light-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div><div style="color:var(--light-blue); font-weight:900; margin-top:20px; letter-spacing:4px; font-size:12px;">LOADING...</div></div>
    
    <div class="app-container">
        <header>
            <div class="logo">GAMESHOWS</div>
            <div style="color: #10b981; font-size: 10px; font-weight: 800; border: 1px solid #10b981; padding: 2px 8px; border-radius: 99px;">ONLINE</div>
        </header>

        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search for shows...">
        </div>

        <!-- Catalog Filter -->
        <div class="catalog">
            <div class="cat-item active">All Shows</div>
            <div class="cat-item">Big Wheels</div>
            <div class="cat-item">Live Slots</div>
            <div class="cat-item">Board Games</div>
            <div class="cat-item">New Hits</div>
        </div>

        <div class="hero">
            <div class="hero-img"></div>
            <div class="hero-overlay"></div>
            <div style="position: relative; z-index: 10;">
                <h2 style="font-size: 32px; font-weight: 900; line-height: 0.95; letter-spacing: -1px;">Adventures Beyond Wonderland</h2>
                <a href="#" onclick="launch('live-casino/game-shows/adventures-beyond-wonderland')" class="hero-btn">ENTER THE SHOW</a>
            </div>
        </div>

        <div class="grid">
            <div class="card"><div class="card-img" style="background-image: url('https://sc02.alicdn.com/kf/A2b7ef98470b84172880cd5f9c458b7b30.png')"></div><div class="card-info"><div class="card-name">MEGA WHEEL</div><a href="#" onclick="launch('live-casino/game-shows/mega-wheel')" class="card-btn">PLAY NOW</a></div></div>
            <div class="card"><div class="card-img" style="background-image: url('https://sc02.alicdn.com/kf/A3e5cfab1f48246c09ee16b2610082283l.png')"></div><div class="card-info"><div class="card-name">SPIN A WIN</div><a href="#" onclick="launch('live-casino/game-shows/live-spin-a-win')" class="card-btn">PLAY NOW</a></div></div>
            <div class="card"><div class="card-img" style="background-image: url('https://sc02.alicdn.com/kf/Afe17f031ddb7404f8b37195e4a084253y.png')"></div><div class="card-info"><div class="card-name">BUFFALO LIVE</div><a href="#" onclick="launch('live-casino/game-shows/buffalo-blitz-live-slots')" class="card-btn">PLAY NOW</a></div></div>
            <div class="card"><div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1596838132731-3301c3fd4317?auto=format&fit=crop&w=400&q=80')"></div><div class="card-info"><div class="card-name">GOLDEN WHEEL</div><a href="#" onclick="launch('live-casino/game-shows')" class="card-btn">PLAY NOW</a></div></div>
        </div>

        <footer style="padding: 40px 20px; text-align: center; color: #222; font-size: 10px; font-weight: 900; border-top: 1px solid #111; letter-spacing: 1px;">
            GAMESHOWS PORTAL • 18+ ONLY
        </footer>
    </div>
    <script>
        function launch(gamePath) {
            document.getElementById('loader').style.display = 'flex';
            setTimeout(() => {
                window.location.href = `https://www.mcluck.com/games/${gamePath}?r=6f535be9%2F2810840932`;
            }, 1000);
        }
    </script>
</body>
</html>
